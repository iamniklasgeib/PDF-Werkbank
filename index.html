<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDF-Werkbank</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2446c7">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232446c7%27/%3E%3Cpath d=%27M9 6h10l5 5v15H9z%27 fill=%27%23fff%27/%3E%3Cpath d=%27M19 6v5h5%27 fill=%27none%27 stroke=%27%232446c7%27 stroke-width=%271.5%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M12.5 21.5l6-6 2 2-6 6h-2z%27 fill=%27%232446c7%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Werkbank — Kopfzeile, Werkzeugleiste, Seitenliste links, weißes Papier auf kühler Arbeitsfläche */
:root{
  --desk:#e4e8ee; --panel:#f8f9fb; --line:#d4dae3; --hover:#eceff4;
  --ink:#161b26; --muted:#5b6475; --accent:#2446c7; --accent-soft:#e2e8fb; --accent-line:#b7c4f1;
  --danger:#b42318; --paper:#ffffff; --shadow:rgba(22,27,38,.16); --scrim:rgba(14,18,26,.35);
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#12151b; --panel:#1b1f27; --line:#2c323d; --hover:#252a34;
    --ink:#e6e9ef; --muted:#9aa3b2; --accent:#8fa3ff; --accent-soft:#232b4a; --accent-line:#3b4a8a;
    --danger:#ff8b7b; --paper:#ffffff; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#12151b; --panel:#1b1f27; --line:#2c323d; --hover:#252a34;
  --ink:#e6e9ef; --muted:#9aa3b2; --accent:#8fa3ff; --accent-soft:#232b4a; --accent-line:#3b4a8a;
  --danger:#ff8b7b; --paper:#ffffff; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,label{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{color:var(--accent)}
.doc{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 200px}
.doc .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.chip{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.dirty{font-size:12px;color:var(--muted);white-space:nowrap}
.dirty::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn[disabled]{opacity:.6;cursor:progress}

/* Werkzeugleiste */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.group{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:24px;background:var(--line)}
.tbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;padding:0}
.tbtn:hover{background:var(--hover)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.tbtn[disabled]{opacity:.35;cursor:default;background:transparent}
.tbtn svg{width:20px;height:20px}
#btnPages{display:none}
.props{gap:10px;min-height:36px;flex-wrap:wrap}
.swatches{display:flex;gap:4px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.size{display:flex;align-items:center;gap:8px}
.size .lbl{font-size:12px;color:var(--muted)}
.size input{width:110px;accent-color:var(--accent)}
.size output{font-size:12px;min-width:48px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);max-width:52ch}
.zoom{margin-left:auto}
#zoomVal{font-size:12px;min-width:44px;text-align:center;color:var(--muted)}
#pageInd{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}

/* Hauptbereich */
.main{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-head h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side .btn{height:30px;padding:0 9px;font-size:12.5px}
.thumbs{display:flex;flex-direction:column;gap:6px}
.thumb{display:grid;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.thumb:hover{background:var(--hover)}
.thumb.active{border-color:var(--accent-line);background:var(--accent-soft)}
.tc{justify-self:center;background:var(--paper);box-shadow:0 1px 3px var(--shadow);position:relative}
.tc canvas{position:absolute;inset:0;width:100%;height:100%}
.trow{display:flex;align-items:center;justify-content:space-between;gap:4px}
.trow .no{font-size:12px;color:var(--muted)}
.mini{display:flex;gap:0}
.mini button{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--muted);padding:0}
.mini button:hover{background:var(--panel);color:var(--ink)}
.mini button.del:hover{color:var(--danger)}
.mini svg{width:15px;height:15px}
.side-note{font-size:12px;color:var(--muted);line-height:1.45;margin:4px 2px 0}

.viewer{overflow:auto;min-height:0;position:relative}
.pages{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 24px 72px;width:max-content;min-width:100%}
.page{position:relative;background:var(--paper);box-shadow:0 1px 2px var(--shadow),0 10px 30px var(--shadow);flex:none}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.page .ov{z-index:2;touch-action:none}
.pages[data-tool="select"] .ov{touch-action:pan-x pan-y}
.pages[data-tool="text"] .ov{cursor:text}
.pages[data-tool="pen"] .ov,.pages[data-tool="highlight"] .ov,.pages[data-tool="whiteout"] .ov,.pages[data-tool="box"] .ov{cursor:crosshair}
.pno{position:absolute;top:100%;left:0;right:0;text-align:center;margin-top:7px;font-size:11px;color:var(--muted)}
.editor{position:absolute;z-index:3;margin:0;padding:0;border:0;background:rgba(255,255,255,.7);outline:1.5px dashed var(--accent);outline-offset:3px;resize:none;overflow:hidden;white-space:pre;font-family:Helvetica,Arial,sans-serif;line-height:1.2;caret-color:#2446c7}
.loading{padding:60px 0;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-top:12vh;max-width:40ch;color:var(--muted)}
.empty svg{color:var(--accent)}
.empty h1{margin:6px 0 0;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.empty p{margin:0 0 8px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:min(520px,calc(100vw - 32px));z-index:50;box-shadow:0 8px 24px var(--shadow)}
.drop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--scrim);pointer-events:none}
.drop div{background:var(--panel);border:2px dashed var(--accent);border-radius:14px;padding:28px 36px;font-weight:500;text-align:center}
.drop small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:19}

@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(260px,82vw);z-index:20;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 0 30px var(--shadow)}
  .side.open{transform:none}
  #btnPages{display:grid}
  .zoom{margin-left:0}
  .pages{padding:20px 16px 72px}
  .brand span{display:none}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }
</style>

</head>
<body>
<div class="app">
  <header class="bar gutter">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.8h8.2L19 7.6V21.2H6z"/><path d="M14 3v5h5"/><path d="M9 16.5l5.5-5.5 1.8 1.8-5.5 5.5H9z" fill="currentColor" stroke="none"/></svg>
      <span>PDF-Werkbank</span>
    </div>
    <div class="doc">
      <span class="name" id="docName">Kein Dokument</span>
      <span class="dirty" id="dirtyInd" hidden>Ungespeichert</span>
    </div>
    <div class="actions">
      <label class="btn" for="fileOpen" title="PDF öffnen (ersetzt das aktuelle Dokument)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>Öffnen</label>
      <input type="file" id="fileOpen" accept="application/pdf,.pdf" hidden>
      <label class="btn" for="fileAppend" title="Seiten einer weiteren PDF hinten anfügen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>PDF anhängen</label>
      <input type="file" id="fileAppend" accept="application/pdf,.pdf" hidden>
      <button class="btn primary" id="btnSave" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Speichern</button>
    </div>
  </header>

  <div class="tools gutter" role="toolbar" aria-label="Werkzeuge">
    <div class="group">
      <button class="tbtn" id="btnPages" type="button" title="Seitenübersicht" aria-label="Seitenübersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
      <button class="tbtn" data-tool="select" type="button" title="Auswählen &amp; verschieben (V)" aria-label="Auswählen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5.5 3.5l13 7.5-5.8 1.4-3 5.6z"/></svg></button>
      <button class="tbtn" data-tool="text" type="button" title="Text (T)" aria-label="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></svg></button>
      <button class="tbtn" data-tool="pen" type="button" title="Zeichnen / Unterschreiben (P)" aria-label="Zeichnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M14 7l3.5 3.5"/></svg></button>
      <button class="tbtn" data-tool="highlight" type="button" title="Markieren (H)" aria-label="Markieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 14.5l8-8.5 3.5 3.5-8.5 8H7z"/><path d="M4 21h8" stroke-width="3"/></svg></button>
      <button class="tbtn" data-tool="whiteout" type="button" title="Weiß abdecken (W)" aria-label="Abdecken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 16.5l9.5-9.5 5.5 5.5-6 6H7z"/><path d="M10 10.5l5.5 5.5M11 20h9"/></svg></button>
      <button class="tbtn" data-tool="box" type="button" title="Rahmen (R)" aria-label="Rahmen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5.5" width="16" height="13" rx="1"/></svg></button>
      <button class="tbtn" id="btnImage" type="button" title="Bild oder Unterschrift-Foto einfügen" aria-label="Bild einfügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M3.5 16l5-5 4.5 4.5 2.5-2.5 5 5"/><circle cx="15.5" cy="9.5" r="1.5"/></svg></button>
      <input type="file" id="fileImage" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    </div>
    <div class="sep"></div>
    <div class="group props" id="props">
      <div class="swatches" id="swatches"></div>
      <label class="size" id="sizeWrap"><span class="lbl">Größe</span><input type="range" id="sizeRange" min="1" max="10" step="1"><output id="sizeVal" class="mono"></output></label>
      <span class="hint" id="hint"></span>
    </div>
    <div class="group">
      <button class="tbtn" id="btnUndo" type="button" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="tbtn" id="btnRedo" type="button" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="tbtn" id="btnDelete" type="button" title="Auswahl löschen (Entf)" aria-label="Auswahl löschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></svg></button>
    </div>
    <div class="group zoom">
      <span id="pageInd" class="mono">– / –</span>
      <button class="tbtn" id="btnZoomOut" type="button" title="Verkleinern" aria-label="Verkleinern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
      <span id="zoomVal" class="mono">100%</span>
      <button class="tbtn" id="btnZoomIn" type="button" title="Vergrößern" aria-label="Vergrößern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
      <button class="tbtn" id="btnFit" type="button" title="An Breite anpassen" aria-label="An Breite anpassen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>

  <div class="main">
    <aside class="side" id="side" aria-label="Seiten">
      <div class="side-head">
        <h2 id="pageCount">Seiten</h2>
        <button class="btn" id="btnBlank" type="button" title="Leere Seite nach der aktuellen einfügen">+ Leer</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <p class="side-note">PDF hierher ziehen, um sie anzuhängen. Überall sonst ablegen öffnet sie neu.</p>
    </aside>
    <section class="viewer" id="viewer">
      <div class="pages" id="pages" data-tool="select"><div class="loading">PDF-Werkzeuge werden geladen …</div></div>
    </section>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop" id="drop" hidden><div>PDF oder Bild hier ablegen<small id="dropSub">PDF öffnen · Bild auf aktuelle Seite</small></div></div>

<script src="lib/pdf-lib.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
if (!window.PDFLib || !window.pdfjsLib) { $('#pages').innerHTML = '<div class="loading">Die PDF-Bibliotheken konnten nicht geladen werden. Bitte Seite neu laden.</div>'; return; }
const { PDFDocument, rgb, degrees, StandardFonts, LineCapStyle } = PDFLib;
try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js'; } catch (e) {}

/* ---------- Zustand ---------- */
const S = {
  srcs: [], pages: [], images: {},
  tool: 'select',
  colors: { text: '#161b26', pen: '#2446c7', highlight: '#ffd43b', box: '#c92a2a' },
  sizes: { text: 14, pen: 2.5, box: 2 },
  scale: 1, sel: null, active: 0, fileName: '', sample: false, dirty: false
};
let uid = 1; const nid = () => 'a' + (uid++);
const undoStack = [], redoStack = [];
let measureFont = null, drag = null, editor = null, editingId = null;
const pageEls = new Map(), baseCache = new Map(), thumbCache = new Map();
let io = null;
const DARK = ['#161b26', '#2446c7', '#c92a2a', '#2b8a3e', '#e8590c'];
const LIGHT = ['#ffd43b', '#8ce99a', '#a5d8ff', '#fcc2d7', '#ffc078'];
const SIZE_CFG = { text: { min: 6, max: 72, step: 1 }, pen: { min: 0.5, max: 12, step: 0.5 }, box: { min: 0.5, max: 8, step: 0.5 } };


/* ---------- Geometrie ---------- */
class VP {
  constructor(view, scale, rotation) {
    const cx = (view[2] + view[0]) / 2, cy = (view[3] + view[1]) / 2;
    let a, b, c, d;
    switch (rotation) {
      case 90: a = 0; b = 1; c = 1; d = 0; break;
      case 180: a = -1; b = 0; c = 0; d = 1; break;
      case 270: a = 0; b = -1; c = -1; d = 0; break;
      default: a = 1; b = 0; c = 0; d = -1;
    }
    let ox, oy, w, h;
    if (a === 0) { ox = Math.abs(cy - view[1]) * scale; oy = Math.abs(cx - view[0]) * scale; w = (view[3] - view[1]) * scale; h = (view[2] - view[0]) * scale; }
    else { ox = Math.abs(cx - view[0]) * scale; oy = Math.abs(cy - view[1]) * scale; w = (view[2] - view[0]) * scale; h = (view[3] - view[1]) * scale; }
    this.m = [a * scale, b * scale, c * scale, d * scale, ox - a * scale * cx - c * scale * cy, oy - b * scale * cx - d * scale * cy];
    this.width = w; this.height = h; this.scale = scale;
  }
  toVp(x, y) { const m = this.m; return [x * m[0] + y * m[2] + m[4], x * m[1] + y * m[3] + m[5]]; }
  toPdf(x, y) { const m = this.m, D = m[0] * m[3] - m[1] * m[2]; return [(x * m[3] - y * m[2] + m[2] * m[5] - m[4] * m[3]) / D, (-x * m[1] + y * m[0] + m[4] * m[1] - m[5] * m[0]) / D]; }
}
const Rot = p => (((p.baseRot + p.rot) % 360) + 360) % 360;
const vpFor = (p, scale) => new VP(p.view, scale, Rot(p));

/* ---------- Texteditor ---------- */
const mctx = document.createElement('canvas').getContext('2d');

/* ---------- Dateien ---------- */
async function loadSource(bytes) {
  const doc = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;

  for (let i = 0; i < doc.numPages; i++) { const pg = await doc.getPage(i + 1); pages.push({ view: pg.view.slice(), rotate: pg.rotate || 0 }); }
  return { bytes, doc, pages };
}
function pagesFrom(si) { return S.srcs[si].pages.map((pp, i) => ({ id: nid(), src: si, idx: i, baseRot: pp.rotate, rot: 0, view: pp.view, annots: [] })); }

const isPdfName = f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
async function openFile(file, append) {
  if (!file) return;
  await ready;
  if (!isPdfName(file)) { toast('Bitte eine PDF-Datei wählen.'); return; }
  commitEditor();
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const src = await loadSource(bytes);
    if (!append) {
      S.srcs.forEach(s => { try { s.doc.destroy(); } catch (_) {} });
      S.srcs = [src]; S.pages = pagesFrom(0); S.images = {}; S.sel = null; S.active = 0;
      undoStack.length = 0; redoStack.length = 0; baseCache.clear(); thumbCache.clear();

      toast(src.pages.length + (src.pages.length === 1 ? ' Seite' : ' Seiten') + ' aus „' + file.name + '“ angehängt.');
    }
  } catch (err) {

async function insertImage(file) {

    let bytes, type;

/* ---------- Export ---------- */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); }
async function exportPdf() {
  const out = await PDFDocument.create();
  const font = await out.embedFont(StandardFonts.Helvetica);
  const copied = new Map();
  for (let i = 0; i < S.srcs.length; i++) {
    const idxs = S.pages.filter(p => p.src === i).map(p => p.idx); if (!idxs.length) continue;
    let lib;
    try { lib = await PDFDocument.load(S.srcs[i].bytes); }
    catch (e) { if (/encrypt/i.test((e && (e.message || e.name)) || '')) { const er = new Error('encrypted'); er.code = 'encrypted'; throw er; } throw e; }

  const imgs = {};

    const page = p.src < 0 ? out.addPage([p.view[2] - p.view[0], p.view[3] - p.view[1]]) : out.addPage(copied.get(p.src + ':' + p.idx));

      else if (a.type === 'box') page.drawRectangle({ x: a.A[0], y: a.A[1], width: a.w, height: a.h, rotate: rot, borderColor: hexRgb(a.color), borderWidth: a.width });

}
async function save() {
  commitEditor();

  try {
    let bytes;
    try { bytes = await exportPdf(); }
    catch (e) { toast(e && e.code === 'encrypted' ? 'Diese PDF ist gegen Bearbeitung geschützt. Speichern ist dafür leider nicht möglich.' : 'Beim Erzeugen der PDF ist ein Fehler aufgetreten.'); return; }

      catch (e) { if (e && e.name === 'AbortError') { toast('Speichern abgebrochen.'); return; } handle = null; }

/* ---------- Oberfläche verdrahten ---------- */

$('#fileOpen').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; openFile(f, false); });

  const a = getSel(); if (!a) return; const p = pageById(S.sel.page), before = snap();

document.addEventListener('keydown', e => {

let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').hidden = false; });

/* ---------- Start ---------- */
let readyResolve; const ready = new Promise(r => { readyResolve = r; });
(async () => {
  try {
    const tmp = await PDFDocument.create(); measureFont = await tmp.embedFont(StandardFonts.Helvetica);
    setTool('select'); rebuild(); updateProps(); readyResolve();
  } catch (e) {
    $('#pages').innerHTML = '<div class="loading">Start fehlgeschlagen: ' + String(e && e.message || e).replace(/</g, '&lt;') + '</div>';
  }
})();
/* Per Doppelklick in Windows geöffnete PDFs empfangen */

    if (!params.files || !params.files.length) return;
    for (let i = 0; i < params.files.length; i++) {
      try { const file = await params.files[i].getFile(); await openFile(file, i > 0); } catch (e) { toast('Die Datei konnte nicht geöffnet werden.'); }
    }
  });
}
/* Offline-Betrieb */

  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
